<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Kowsalya 💚</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      height:100vh;
      background:
        radial-gradient(circle at top, #1f4037 0%, #0f2027 60%, #000 100%);
      font-family: 'Trebuchet MS', sans-serif;
      color:white;
    }

    canvas{
      position:absolute;
      top:0;
      left:0;
    }

    .container{
      position:relative;
      z-index:10;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .title{
      font-size:4rem;
      color:#9dffb0;
      text-shadow:
        0 0 10px #7dff95,
        0 0 25px #5cff7a,
        0 0 50px #39ff64;
      animation: glow 2s infinite alternate;
    }

    .subtitle{
      margin-top:15px;
      font-size:1.5rem;
      color:#eaffef;
      opacity:0.9;
    }

    .message{
      margin-top:30px;
      max-width:700px;
      line-height:1.8;
      font-size:1.2rem;
      color:#d6ffe0;
      background:rgba(255,255,255,0.08);
      padding:25px;
      border-radius:20px;
      backdrop-filter:blur(8px);
      box-shadow:0 0 20px rgba(100,255,150,0.3);
    }

    .cake{
      margin-top:40px;
      position:relative;
      width:180px;
      height:180px;
    }

    .layer1, .layer2, .layer3{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      border-radius:20px;
    }

    .layer1{
      bottom:0;
      width:180px;
      height:60px;
      background:#5eff8b;
    }

    .layer2{
      bottom:55px;
      width:140px;
      height:50px;
      background:#b5ffcb;
    }

    .layer3{
      bottom:100px;
      width:100px;
      height:40px;
      background:#eaffef;
    }

    .candle{
      position:absolute;
      width:10px;
      height:35px;
      background:white;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      border-radius:5px;
    }

    .flame{
      position:absolute;
      width:18px;
      height:18px;
      background:gold;
      border-radius:50%;
      top:-12px;
      left:50%;
      transform:translateX(-50%);
      animation:flicker 0.2s infinite alternate;
      box-shadow:0 0 20px gold;
    }

    .anime-heart{
      position:absolute;
      color:#9dffb0;
      font-size:24px;
      animation: float 6s linear infinite;
      opacity:0.8;
    }

    @keyframes glow{
      from{
        text-shadow:
          0 0 10px #7dff95,
          0 0 25px #5cff7a;
      }
      to{
        text-shadow:
          0 0 20px #7dff95,
          0 0 40px #5cff7a,
          0 0 70px #39ff64;
      }
    }

    @keyframes flicker{
      from{
        transform:translateX(-50%) scale(1);
      }
      to{
        transform:translateX(-50%) scale(1.2);
      }
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) translateX(0);
        opacity:0;
      }
      10%{
        opacity:1;
      }
      100%{
        transform:translateY(-120vh) translateX(100px);
        opacity:0;
      }
    }

    .footer{
      position:absolute;
      bottom:20px;
      font-size:1rem;
      color:#bfffd0;
      opacity:0.8;
    }

  </style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">

  <div class="title">
    Happy Birthday 💚
  </div>

  <div class="subtitle">
    Princess Kowsalya ✨
  </div>

  <div class="message">
    May your smile shine brighter than stars,
    your dreams bloom beautifully like spring,
    and your life be filled with happiness,
    peace, love, and magical anime moments 💚✨
    <br><br>
    Today is your day, Queen 👑
  </div>

  <div class="cake">
    <div class="layer1"></div>
    <div class="layer2"></div>
    <div class="layer3"></div>

    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

</div>

<div class="footer">
  Made with 💚 for Kowsalya
</div>

<script>

  // ===============================
  // Floating anime hearts
  // ===============================

  function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("anime-heart");
    heart.innerHTML = "💚";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = (4 + Math.random()*4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 8000);
  }

  setInterval(createHeart, 400);


  // ===============================
  // Fireworks Canvas
  // ===============================

  const canvas = document.getElementById("fireworks");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let particles = [];

  class Particle{
    constructor(x,y,color){
      this.x = x;
      this.y = y;

      this.radius = 2 + Math.random()*3;

      this.speedX = (Math.random()-0.5)*8;
      this.speedY = (Math.random()-0.5)*8;

      this.alpha = 1;
      this.color = color;
    }

    update(){
      this.x += this.speedX;
      this.y += this.speedY;
      this.alpha -= 0.015;
    }

    draw(){
      ctx.save();
      ctx.globalAlpha = this.alpha;

      ctx.beginPath();
      ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);

      ctx.fillStyle = this.color;
      ctx.fill();

      ctx.restore();
    }
  }

  function createFirework(){
    const x = Math.random()*canvas.width;
    const y = Math.random()*canvas.height/2;

    const colors = [
      "#5eff8b",
      "#9dffb0",
      "#d6ffe0",
      "#ffffff"
    ];

    for(let i=0;i<80;i++){
      particles.push(
        new Particle(
          x,
          y,
          colors[Math.floor(Math.random()*colors.length)]
        )
      );
    }
  }

  function animate(){
    requestAnimationFrame(animate);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((particle,index)=>{
      particle.update();
      particle.draw();

      if(particle.alpha <= 0){
        particles.splice(index,1);
      }
    });
  }

  animate();

  setInterval(createFirework,1000);

  window.addEventListener("resize",()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

</script>

</body>
</html>
